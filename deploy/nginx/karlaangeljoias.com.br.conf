# /etc/nginx/sites-available/karlaangeljoias.com.br
#
# IMPORTANTE: este é um arquivo de configuração NOVO e ISOLADO.
# Ele não altera, sobrescreve nem depende de nenhum outro server block
# existente no servidor (como o de fusionbeef.com.br). Cada domínio no
# Nginx vive em seu próprio arquivo dentro de sites-available/, e o
# Nginx roteia pela porta 443 + Host header (SNI) — múltiplos domínios
# convivem no mesmo servidor sem conflito, desde que cada um aponte para
# seu próprio "root" e tenha seu próprio certificado.
#
# Instalação (ver deploy/README.md para o passo a passo comentado):
#   sudo cp karlaangeljoias.com.br.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/karlaangeljoias.com.br.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d karlaangeljoias.com.br -d www.karlaangeljoias.com.br

server {
    listen 80;
    listen [::]:80;
    server_name karlaangeljoias.com.br www.karlaangeljoias.com.br;

    # Diretório exclusivo deste site — não é compartilhado com o
    # fusionbeef.com.br nem com nenhum outro domínio do servidor.
    root /var/www/karlaangeljoias/dist;
    index index.html;

    # Gzip para os assets do build (Vite já gera arquivos com hash no nome,
    # então cache longo é seguro para /assets/).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.svg {
        access_log off;
    }

    # Cabeçalhos básicos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Após rodar `certbot --nginx -d karlaangeljoias.com.br`, o Certbot cria
# automaticamente um bloco `server { listen 443 ssl; ... }` neste MESMO
# arquivo e adiciona o redirect 80 -> 443. Ele não mexe em outros arquivos
# de sites-available/, então o fusionbeef.com.br permanece intocado.
