server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy para a API — mesmo domínio (karlaangeljoias.com.br), então o
    # site consegue buscar produtos/textos/carrossel dinâmicos sem CORS.
    # Só rotas GET públicas são chamadas a partir do site (o site não
    # tem cookie de sessão admin, então rotas protegidas continuam
    # bloqueadas mesmo passando por aqui).
    location /api/ {
        proxy_pass http://karlaangeljoias-api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://karlaangeljoias-api:4000/uploads/;
        proxy_set_header Host $host;
    }

    # Rota de health check usada pelo kamal-proxy para saber se o
    # container está pronto antes de rotear tráfego para ele.
    location = /up {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
