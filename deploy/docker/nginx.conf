server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy para a API — mesmo domínio (karlaangeljoias.com.br), então o
    # site consegue buscar produtos/textos/carrossel dinâmicos sem CORS.
    # Só rotas GET públicas são chamadas a partir do site (o site não
    # tem cookie de sessão admin, então rotas protegidas continuam
    # bloqueadas mesmo passando por aqui).
    #
    # "resolver" + variável: sem isso, o Nginx guarda em cache para
    # sempre o IP do container da API resolvido no momento em que ELE
    # MESMO iniciou — quando a API é substituída num deploy (IP novo),
    # o Nginx do site continuaria apontando pro IP antigo e morto (502).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream karlaangeljoias-api:4000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $api_upstream karlaangeljoias-api:4000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # Rota de health check usada pelo kamal-proxy para saber se o
    # container está pronto antes de rotear tráfego para ele.
    location = /up {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
