server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Limite de tamanho de upload (o padrão do Nginx é só 1MB, o que
    # bloqueava o envio de fotos de produtos com erro 413).
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Painel admin nunca deve ser indexado.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy para a API — mesmo domínio (admin.karlaangeljoias.com.br),
    # então os cookies de sessão funcionam sem CORS.
    #
    # IMPORTANTE: usamos "resolver" + variável em vez de um hostname fixo
    # no proxy_pass. Sem isso, o Nginx resolve o nome do container só uma
    # vez, no momento em que ele mesmo inicia, e guarda esse IP em cache
    # para sempre — quando o container da API é substituído num deploy
    # (ganhando um IP novo), o Nginx continua tentando falar com o IP
    # antigo e morto, causando 502. O resolver do Docker (127.0.0.11)
    # com uma variável força a resolução de novo a cada requisição.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream karlaangeljoias-api:4000;
        proxy_pass http://$api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $api_upstream karlaangeljoias-api:4000;
        proxy_pass http://$api_upstream/uploads/;
        proxy_set_header Host $host;
    }

    location = /up {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
