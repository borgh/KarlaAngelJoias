server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Painel admin nunca deve ser indexado.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy para a API — mesmo domínio (admin.karlaangeljoias.com.br),
    # então os cookies de sessão funcionam sem CORS.
    location /api/ {
        proxy_pass http://karlaangeljoias-api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://karlaangeljoias-api:4000/uploads/;
        proxy_set_header Host $host;
    }

    location = /up {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
